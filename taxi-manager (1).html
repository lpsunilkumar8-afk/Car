<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Taxi Manager</title>
<style>
:root{
  --bg:#f4f3ef;--card:#ffffff;--ink:#16181d;--muted:#6b6f78;--line:#e4e2db;
  --accent:#f5b400;--accent-ink:#1a1400;--accent-soft:#fff4cf;
  --good:#1f8a4c;--good-soft:#e3f5ea;--bad:#c8372d;--bad-soft:#fbe6e4;--warn:#b86e00;--warn-soft:#fff0d9;
  --side:#14161a;--side-ink:#d9dbe0;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1114;--card:#181b20;--ink:#eceef2;--muted:#9097a3;--line:#2a2e35;
  --accent-soft:#3a2f0a;--good-soft:#123222;--bad-soft:#3a1714;--warn-soft:#3a2a0e;--good:#4cc27e;--bad:#ff7a6e;--warn:#f0a73a;
  --side:#0b0c0f;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:232px;background:var(--side);color:var(--side-ink);padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;color:#fff;font-size:16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;font-weight:400;color:#8b909a;font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;cursor:pointer;font-size:14.5px}
.nav a:hover{background:#ffffff10}
.nav a.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav svg{width:19px;height:19px;flex-shrink:0}
main{flex:1;min-width:0;padding:22px 28px 100px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:23px;margin:0;flex:1;letter-spacing:-.01em}
.monthpick{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.monthpick button{border:0;background:none;padding:8px 11px;cursor:pointer;color:var(--muted)}
.monthpick span{min-width:104px;text-align:center;font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
main,.card{min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.two{grid-template-columns:1.4fr 1fr}
.row{display:flex;align-items:center;gap:10px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.it .main{flex:1;min-width:0}
.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .d{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);font-size:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;border-bottom:0}
.tablewrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.alert.bad{background:var(--bad-soft)}.alert.warn{background:var(--warn-soft)}
.alert b{font-weight:600}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.bars .g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bars .b{width:42%;max-width:22px;border-radius:5px 5px 0 0;min-height:2px}
.bars .lb{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.carcards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.carcard .plate{font-weight:800;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);display:inline-block;padding:3px 9px;border-radius:6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:9px;padding:8px}
.stats .l{font-size:11.5px;color:var(--muted)}.stats .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.sal .brk{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px;margin:10px 0}
.sal .brk span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.sal .net{display:flex;justify-content:space-between;font-weight:700;font-size:17px;border-top:1px dashed var(--line);padding-top:8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h2{margin:0;font-size:17px}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal footer .sp{flex:1}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{font-size:12.5px;color:var(--muted)}
.calcbox{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-size:14px}
/* mobile */
.tabbar,.fab,.mtop{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  aside{display:none}
  main{padding:12px 16px 110px}
  .top h1{font-size:20px;flex-basis:100%}
  .top .monthpick{flex:1}
  .top .monthpick span{flex:1}
  .mtop{display:flex;align-items:center;gap:10px;margin:0 -16px 12px;padding:10px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:20}
  .mtop .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .mtop b{flex:1;font-size:15px}
  .mtop .btn{background:#ffffff18;border-color:#ffffff30;color:#fff}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:none}
  .tabbar a.on{color:var(--ink);font-weight:700}
  .tabbar a.on svg{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:31;cursor:pointer}
  .kpi .v{font-size:20px}
  .card{padding:14px}
  .fg{grid-template-columns:1fr}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh}
  .hide-m{display:none}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
}
#printArea{display:none}
@media print{#printArea{display:block}}
.slip{font:14px/1.5 system-ui,sans-serif;color:#000;padding:30px;max-width:700px}
.slip h1{margin:0;font-size:22px}.slip table td,.slip table th{border:1px solid #999;padding:6px 10px;color:#000}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M9 4h6"/></svg></div><div><span id="brandName">Taxi Manager</span><small>Fleet &amp; finance</small></div></div>
    <nav class="nav" id="sideNav"></nav>
  </aside>
  <main>
    <div class="mtop"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg></div><b id="mBrand">Taxi Manager</b><button class="btn sm" onclick="reload(true)" title="Refresh">↻</button></div>
    <div id="view"><div class="loading">Connecting to database…</div></div>
  </main>
</div>
<nav class="tabbar" id="tabBar"></nav>
<button class="fab" id="fab" onclick="quickAdd()" aria-label="Add">+</button>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ====== CONFIG ====== */
const SB_URL = "https://lknsirszamdzbhuvmsdl.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrbnNpcnN6YW1kemJodXZtc2RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNTM1ODYsImV4cCI6MjEwODgyOTU4Nn0.jqHPN27SL9QTP2_1gxQQTLL1y9WD17iuoVN6MS0kRHs";

const EXP_CATS = ["Fuel","Service","Repair","Tyres","Insurance","Permit / Tax","PUC / Fitness","Toll","Parking","Car Wash","Car EMI","Traffic Fine","Office Rent","Phone / Internet","Staff Food","Misc"];
const DOC_TYPES_CAR = ["Insurance","Permit","PUC","Fitness","Road Tax","RC","Other"];
const DOC_TYPES_DRV = ["Driving License","Badge","Police Verification","Other"];
const PAY_MODES = ["Cash","UPI","Online","Credit Card","Debit Card","Bank Transfer"];
const PAY_TYPES = {fixed:"Fixed monthly",commission:"Commission %",per_trip:"Per trip",per_day:"Per day"};
const CAT_ICON = {Fuel:"⛽",Service:"🔧",Repair:"🛠️",Tyres:"🛞",Insurance:"🛡️","Permit / Tax":"📄","PUC / Fitness":"📋",Toll:"🛣️",Parking:"🅿️","Car Wash":"🧽","Car EMI":"🏦","Traffic Fine":"🚨","Office Rent":"🏢","Phone / Internet":"📱","Staff Food":"🍱",Misc:"📦"};

/* ====== DATA LAYER (Supabase REST) ====== */
const H = {apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, "Content-Type":"application/json"};
async function api(path, opts={}){
  const r = await fetch(SB_URL+"/rest/v1/"+path, {...opts, headers:{...H, ...(opts.headers||{})}});
  if(!r.ok){ let m = r.status+""; try{ const j = await r.json(); m = j.message||j.hint||m; }catch(e){} throw new Error(m); }
  if(r.status===204) return null;
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function fetchAll(table, order){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    const rows = await api(`${table}?select=*${order?"&order="+order:""}`, {headers:{Range:`${from}-${from+size-1}`, "Range-Unit":"items"}});
    out.push(...rows); if(rows.length<size) break;
  }
  return out;
}
const db = {
  insert:(t,row)=>api(t,{method:"POST",body:JSON.stringify(row),headers:{Prefer:"return=representation"}}).then(r=>r[0]),
  update:(t,id,row)=>api(`${t}?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(row),headers:{Prefer:"return=representation"}}).then(r=>r[0]),
  remove:(t,id)=>api(`${t}?id=eq.${id}`,{method:"DELETE"}),
  upsert:(t,row,conflict)=>api(`${t}?on_conflict=${conflict}`,{method:"POST",body:JSON.stringify(row),headers:{Prefer:"resolution=merge-duplicates,return=representation"}}).then(r=>r[0]),
};

/* ====== STATE ====== */
const S = {settings:{}, cars:[], drivers:[], trips:[], expenses:[], advances:[], salaries:[], documents:[], car_loans:[], credit_cards:[], card_payments:[]};
const todayStr = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
let MONTH = todayStr().slice(0,7);
let VIEW = "dashboard";
const F = {}; // per-view filters

async function reload(manual){
  try{
    const [settings,cars,drivers,trips,expenses,advances,salaries,documents,car_loans,credit_cards,card_payments] = await Promise.all([
      api("settings?select=*&id=eq.1"), fetchAll("cars","reg_no"), fetchAll("drivers","name"),
      fetchAll("trips","trip_date.desc,created_at.desc"), fetchAll("expenses","exp_date.desc,created_at.desc"),
      fetchAll("advances","adv_date.desc"), fetchAll("salaries","month.desc"), fetchAll("documents","expiry_date"),
      fetchAll("car_loans","created_at"), fetchAll("credit_cards","name"), fetchAll("card_payments","pay_date.desc")
    ]);
    Object.assign(S,{settings:settings[0]||{},cars,drivers,trips,expenses,advances,salaries,documents,car_loans,credit_cards,card_payments});
    document.getElementById("brandName").textContent = document.getElementById("mBrand").textContent = S.settings.company_name||"Taxi Manager";
    document.title = (S.settings.company_name||"Taxi")+" · Manager";
    render();
    if(manual) toast("Data refreshed");
  }catch(e){
    document.getElementById("view").innerHTML = `<div class="loading"><div><b>Couldn't reach the database.</b><br><span class="hint">${esc(e.message)}</span><br><br><button class="btn pri" onclick="reload()">Try again</button></div></div>`;
  }
}

/* ====== HELPERS ====== */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n)?n:0; };
const r2 = n => Math.round(n*100)/100;
const inr = n => { const v=Math.round(num(n)); return (v<0?"−":"")+"₹"+Math.abs(v).toLocaleString("en-IN"); };
const sum = (a,f) => a.reduce((s,x)=>s+num(f?f(x):x),0);
const fdate = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"2-digit"}) : "—";
const mlabel = m => new Date(m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const mshort = m => new Date(m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"short"});
const shiftMonth = (m,k) => { const d=new Date(m+"-01T00:00:00"); d.setMonth(d.getMonth()+k); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const daysUntil = d => Math.round((new Date(d+"T00:00:00") - new Date(todayStr()+"T00:00:00"))/864e5);
const car = id => S.cars.find(c=>c.id===id);
const drv = id => S.drivers.find(d=>d.id===id);
const carName = id => car(id)?.reg_no || "—";
const drvName = id => drv(id)?.name || "—";
const inM = (d,m=MONTH) => (d||"").startsWith(m);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
const activeCars = () => S.cars.filter(c=>c.status!=="Inactive");
const activeDrivers = () => S.drivers.filter(d=>d.status!=="Inactive");

/* ====== CALCULATIONS ====== */
function salaryCalc(d, m=MONTH){
  const trips = S.trips.filter(t=>t.driver_id===d.id && inM(t.trip_date,m));
  const earnings = sum(trips,t=>t.fare);
  const autoDays = new Set(trips.map(t=>t.trip_date)).size;
  const saved = S.salaries.find(s=>s.driver_id===d.id && s.month===m);
  const days = saved ? num(saved.days_worked) : autoDays;
  const fixed = d.pay_type==="fixed" ? num(d.fixed_salary) : 0;
  const commission = d.pay_type==="commission" ? r2(earnings*num(d.commission_pct)/100) : 0;
  const tripPay = d.pay_type==="per_trip" ? trips.length*num(d.per_trip_rate) : 0;
  const dayPay = d.pay_type==="per_day" ? days*num(d.per_day_rate) : 0;
  const bonus = saved ? num(saved.bonus) : 0;
  const gross = r2(fixed+commission+tripPay+dayPay+bonus);
  const given = sum(S.advances.filter(a=>a.driver_id===d.id),a=>a.amount);
  const deductedOther = sum(S.salaries.filter(s=>s.driver_id===d.id && s.month!==m),s=>s.advance_deduction);
  const outstanding = Math.max(0, r2(given-deductedOther));
  const advDed = saved ? num(saved.advance_deduction) : Math.min(outstanding, gross);
  const otherDed = saved ? num(saved.other_deduction) : 0;
  const net = r2(gross-advDed-otherDed);
  const paid = saved ? num(saved.paid_amount) : 0;
  const status = !saved ? "draft" : paid<=0 ? "pending" : paid+0.5<net ? "partial" : "paid";
  return {d,m,trips,earnings,tripsCount:trips.length,autoDays,days,fixed,commission,tripPay,dayPay,bonus,gross,outstanding,advDed,otherDed,net,paid,saved,status};
}
function advanceBalance(id){
  const given = sum(S.advances.filter(a=>a.driver_id===id),a=>a.amount);
  const ded = sum(S.salaries.filter(s=>s.driver_id===id),s=>s.advance_deduction);
  return r2(given-ded);
}
function monthSummary(m=MONTH){
  const trips = S.trips.filter(t=>inM(t.trip_date,m));
  const exps = S.expenses.filter(e=>inM(e.exp_date,m));
  const income = sum(trips,t=>t.fare);
  const expense = sum(exps,e=>e.amount);
  const sal = S.drivers.filter(d=>d.status!=="Inactive" || S.salaries.some(s=>s.driver_id===d.id&&s.month===m)).map(d=>salaryCalc(d,m));
  const salary = sum(sal,s=>s.gross);
  const km = sum(trips,t=>t.km);
  return {trips,exps,income,expense,salary,sal,km,profit:r2(income-expense-salary)};
}
function carReport(m=MONTH){
  const ms = monthSummary(m);
  const rows = S.cars.map(c=>({c,income:0,fuel:0,other:0,salary:0,trips:0,km:0}));
  const byId = Object.fromEntries(rows.map(r=>[r.c.id,r]));
  ms.trips.forEach(t=>{const r=byId[t.car_id]; if(r){r.income+=num(t.fare);r.trips++;r.km+=num(t.km);}});
  let shared = 0;
  ms.exps.forEach(e=>{const r=byId[e.car_id]; if(r){ if(e.category==="Fuel") r.fuel+=num(e.amount); else r.other+=num(e.amount);} else shared+=num(e.amount);});
  let unalloc = 0;
  ms.sal.forEach(s=>{
    if(!s.gross) return;
    const per = {}; s.trips.forEach(t=>{ if(byId[t.car_id]) per[t.car_id]=(per[t.car_id]||0)+num(t.fare); });
    const tot = sum(Object.values(per));
    if(tot>0) Object.entries(per).forEach(([cid,v])=>byId[cid].salary+=s.gross*v/tot);
    else if(byId[s.d.assigned_car_id]) byId[s.d.assigned_car_id].salary+=s.gross;
    else unalloc+=s.gross;
  });
  rows.forEach(r=>r.profit=r.income-r.fuel-r.other-r.salary);
  return {rows:rows.filter(r=>r.c.status!=="Inactive"||r.income||r.fuel||r.other), shared, unalloc, ms};
}
function carOdo(c){
  const odos = S.expenses.filter(e=>e.car_id===c.id && e.odometer).map(e=>num(e.odometer));
  return Math.max(num(c.odometer), ...odos, 0);
}
function alerts(){

  const out = [];
  S.documents.forEach(doc=>{
    if(!doc.expiry_date) return;
    const owner = doc.car_id ? car(doc.car_id) : drv(doc.driver_id);
    if(!owner || owner.status==="Inactive") return;
    const n = daysUntil(doc.expiry_date);
    const who = doc.car_id ? owner.reg_no : owner.name;
    if(n<0) out.push({lvl:"bad",ico:"📄",text:`<b>${esc(doc.doc_type)}</b> expired for ${esc(who)}`,sub:`${-n} day${n===-1?"":"s"} ago · ${fdate(doc.expiry_date)}`,go:"documents"});
    else if(n<=days) out.push({lvl:"warn",ico:"📄",text:`<b>${esc(doc.doc_type)}</b> expiring for ${esc(who)}`,sub:`in ${n} day${n===1?"":"s"} · ${fdate(doc.expiry_date)}`,go:"documents"});
  });
  activeCars().forEach(c=>{
    const last = S.expenses.filter(e=>e.car_id===c.id && e.category==="Service").sort((a,b)=>b.exp_date.localeCompare(a.exp_date))[0];
    if(!last) return;
    const odo = carOdo(c);
    if(last.next_due_km){ const left = num(last.next_due_km)-odo;
      if(left<=0) out.push({lvl:"bad",ico:"🔧",text:`<b>Service overdue</b> for ${esc(c.reg_no)}`,sub:`Due at ${num(last.next_due_km).toLocaleString("en-IN")} km · now ${odo.toLocaleString("en-IN")} km`,go:"cars"});
      else if(left<=kmA) out.push({lvl:"warn",ico:"🔧",text:`<b>Service due soon</b> for ${esc(c.reg_no)}`,sub:`${left.toLocaleString("en-IN")} km left`,go:"cars"}); }
    if(last.next_due_date){ const n = daysUntil(last.next_due_date);
      if(n<0) out.push({lvl:"bad",ico:"🔧",text:`<b>Service date passed</b> for ${esc(c.reg_no)}`,sub:fdate(last.next_due_date),go:"cars"});
      else if(n<=days) out.push({lvl:"warn",ico:"🔧",text:`<b>Service due</b> for ${esc(c.reg_no)}`,sub:`in ${n} days`,go:"cars"}); }
  });
  activeLoans().forEach(l=>{
    const ls = loanSummary(l);
    ls.overdue.forEach(o=>out.push({lvl:"bad",ico:"🏦",text:`<b>EMI overdue</b> for ${esc(carName(l.car_id))}`,sub:`${inr(l.emi_amount)} · ${mlabel(o.m)} · was due ${fdate(o.due)}`,go:"loans"}));
    const st = emiStatus(l,todayStr().slice(0,7)), nx = emiStatus(l,shiftMonth(todayStr().slice(0,7),1));
    [st,nx].forEach(x=>{ if(x&&x.state==="due"&&x.days<=7) out.push({lvl:"warn",ico:"🏦",text:`<b>EMI due</b> for ${esc(carName(l.car_id))}`,sub:`${inr(l.emi_amount)} ${x.days===0?"today":"in "+x.days+" day"+(x.days===1?"":"s")} · ${fdate(x.due)}`,go:"loans"}); });
  });
  S.credit_cards.filter(c=>c.status!=="Inactive").forEach(c=>{
    const cs = cardSummary(c);
    if(cs.outstanding>0 && cs.due && daysUntil(cs.due)<=7) out.push({lvl:daysUntil(cs.due)<=2?"bad":"warn",ico:"💳",text:`<b>Card bill due</b> · ${esc(cardName(c))}`,sub:`${inr(cs.outstanding)} outstanding · due ${fdate(cs.due)}`,go:"cards"});
    if(cs.util!==null && cs.util>=80) out.push({lvl:"warn",ico:"💳",text:`<b>${Math.round(cs.util)}% of limit used</b> · ${esc(cardName(c))}`,sub:`${inr(cs.outstanding)} of ${inr(c.credit_limit)}`,go:"cards"});
  });
  return out.sort((a,b)=>(a.lvl==="bad"?0:1)-(b.lvl==="bad"?0:1));
}

/* ====== EMI & CARDS ====== */
const monthDiff = (a,b) => { const [ay,am]=a.split("-").map(Number), [by,bm]=b.split("-").map(Number); return (by-ay)*12+(bm-am); };
const loan = id => S.car_loans.find(l=>l.id===id);
const loanName = l => l ? `${carName(l.car_id)} · ${l.lender||"Loan"}` : "—";
function emiDueDate(l,m){ const last = new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate(); return m+"-"+String(Math.min(Math.max(1,num(l.emi_day)||1),last)).padStart(2,"0"); }
function emiStatus(l,m){
  const i = monthDiff(l.start_month,m);
  if(i<0 || i>=num(l.tenure_months)) return null;
  const due = emiDueDate(l,m);
  if(i < num(l.paid_before)) return {m,i,due,state:"paid",before:true};
  const pay = S.expenses.find(e=>e.loan_id===l.id && e.emi_month===m);
  if(pay) return {m,i,due,state:"paid",pay};
  const n = daysUntil(due);
  return {m,i,due,state:n<0?"overdue":"due",days:n};
}
function loanSummary(l){
  const ten = num(l.tenure_months), cur = todayStr().slice(0,7);
  const paidMonths = new Set(S.expenses.filter(e=>e.loan_id===l.id && e.emi_month).map(e=>e.emi_month).filter(m=>{const i=monthDiff(l.start_month,m);return i>=num(l.paid_before)&&i<ten;}));
  const paid = Math.min(ten, num(l.paid_before)+paidMonths.size);
  const overdue = [];
  for(let m=shiftMonth(l.start_month,num(l.paid_before)); monthDiff(m,cur)>=0 && monthDiff(l.start_month,m)<ten; m=shiftMonth(m,1)){ const st=emiStatus(l,m); if(st&&st.state==="overdue") overdue.push(st); }
  const remaining = ten-paid;
  return {paid,remaining,overdue,outstanding:remaining*num(l.emi_amount),endMonth:shiftMonth(l.start_month,ten-1),pct:ten?paid/ten*100:0};
}
const activeLoans = () => S.car_loans.filter(l=>l.status!=="Closed");
const card = id => S.credit_cards.find(c=>c.id===id);
const cardName = c => c ? `${c.name}${c.last4?" ••"+c.last4:""}` : "—";
function cardSummary(c, m=MONTH){
  const spend = S.expenses.filter(e=>e.card_id===c.id), pays = S.card_payments.filter(p=>p.card_id===c.id);
  const outstanding = r2(sum(spend,e=>e.amount)-sum(pays,p=>p.amount));
  const mSpend = spend.filter(e=>inM(e.exp_date,m)), mPays = pays.filter(p=>inM(p.pay_date,m));
  let due=null;
  if(c.due_day){ const t=todayStr(); let m2=t.slice(0,7); due=emiDueDate({emi_day:c.due_day},m2); if(due<t) due=emiDueDate({emi_day:c.due_day},shiftMonth(m2,1)); }
  const util = num(c.credit_limit)>0 ? outstanding/num(c.credit_limit)*100 : null;
  return {spend,pays,outstanding,mSpend,mPays,monthSpend:sum(mSpend,e=>e.amount),monthPaid:sum(mPays,p=>p.amount),due,util};
}

function payEmi(lid, m){
  const l = loan(lid); const today = todayStr();
  expenseForm(null,{category:"Car EMI", car_id:l.car_id, amount:l.emi_amount, loan_id:l.id, emi_month:m, payment_mode:"Bank Transfer", exp_date: m===today.slice(0,7)||m<today.slice(0,7) ? today : emiDueDate(l,m), description:`EMI ${mlabel(m)} · ${l.lender||""}`.trim()});
}
function openEmiPicker(){
  const m = todayStr().slice(0,7);
  const due = activeLoans().flatMap(l=>{ const ls=loanSummary(l); const cur=emiStatus(l,m); return [...ls.overdue, ...(cur&&cur.state==="due"?[cur]:[])].map(st=>({l,st})); });
  if(!S.car_loans.length) return loanForm();
  if(due.length===1) return payEmi(due[0].l.id, due[0].st.m);
  openModal("Pay car EMI", due.length?`<div class="list">${due.map(({l,st})=>`<div class="it" onclick="payEmi('${l.id}','${st.m}')"><div class="ico">🏦</div><div class="main"><div class="t">${esc(carName(l.car_id))} · ${mlabel(st.m)}</div><div class="d">${esc(l.lender||"")} · due ${fdate(st.due)}</div></div><div style="text-align:right"><div class="amt">${inr(l.emi_amount)}</div>${emiBadge(st)}</div></div>`).join("")}</div>`:`<div class="empty">All EMIs for this month are paid 👍</div>`, "");
}

/* ====== MODAL / FORMS ====== */
function openModal(title, body, footer){
  document.getElementById("modal").innerHTML = `<header><h2>${title}</h2><button class="x" onclick="closeModal()" aria-label="Close">×</button></header><div class="body">${body}</div>${footer?`<footer>${footer}</footer>`:""}`;
  document.getElementById("ov").classList.add("show");
}
function closeModal(){ document.getElementById("ov").classList.remove("show"); }
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function field(k,label,type="text",val="",opts={}){
  const v = val??"";
  let input;
  if(type==="select") input = `<select id="f_${k}" ${opts.on?`onchange="${opts.on}"`:""}>${opts.options}</select>`;
  else if(type==="textarea") input = `<textarea id="f_${k}" rows="2">${esc(v)}</textarea>`;
  else input = `<input id="f_${k}" type="${type}" value="${esc(v)}" ${type==="number"?'step="any" inputmode="decimal"':""} ${opts.on?`oninput="${opts.on}"`:""} ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}>`;
  return `<div class="f ${opts.full?"full":""}" id="w_${k}" ${opts.hidden?'style="display:none"':""}><label>${label}</label>${input}</div>`;
}
const val = k => { const el=document.getElementById("f_"+k); return el?el.value.trim():""; };
const nval = k => { const v=val(k); return v===""?null:num(v); };
const sval = k => val(k)||null;
const optList = (arr, sel) => arr.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
function footer(saveFn, delFn){ return `${delFn?`<button class="btn danger" onclick="${delFn}">Delete</button>`:""}<span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="saveBtn" onclick="${saveFn}">Save</button>`; }

async function run(fn, msg){
  const b = document.getElementById("saveBtn"); if(b){b.disabled=true;b.textContent="Saving…";}
  try{ await fn(); closeModal(); await reload(); toast(msg||"Saved"); }
  catch(e){ alert("Could not save: "+e.message); if(b){b.disabled=false;b.textContent="Save";} }
}
async function del(table,id,what){ if(!confirm(`Delete this ${what}? This can't be undone.`)) return; await run(()=>db.remove(table,id),"Deleted"); }

  const c = val("category");
  const row = {exp_date:val("exp_date")||todayStr(), amount:nval("amount")||0, category:c, car_id:sval("car_id"), driver_id:sval("driver_id"), payment_mode:val("payment_mode"), description:sval("description"),
    liters: c==="Fuel"?nval("liters"):null, odometer:["Fuel","Service","Repair","Tyres"].includes(c)?nval("odometer"):null,
    next_due_km: c==="Service"?nval("next_due_km"):null, next_due_date: c==="Service"?sval("next_due_date"):null,
    loan_id: c==="Car EMI"?sval("loan_id"):null, emi_month: c==="Car EMI"&&sval("loan_id")?(val("emi_month")||row_m()):null,
    card_id: val("payment_mode")==="Credit Card"?sval("card_id"):null};
  if(!row.amount){ alert("Enter the amount."); return; }
  if(row.payment_mode==="Credit Card" && S.credit_cards.length && !row.card_id){ alert("Select which credit card was used."); return; }
  if(row.loan_id && S.expenses.some(x=>x.id!==id && x.loan_id===row.loan_id && x.emi_month===row.emi_month) && !confirm(`An EMI for ${mlabel(row.emi_month)} is already recorded for this loan. Save another one?`)) return;
  run(async()=>{
    id?await db.update("expenses",id,row):await db.insert("expenses",row);
    const cc = car(row.car_id); if(cc && row.odometer && row.odometer>num(cc.odometer)) await db.update("cars",cc.id,{odometer:row.odometer});
  });
}

function payToggle(){ const p=val("pay_type"); [["fixed","fixed_salary"],["commission","commission_pct"],["per_trip","per_trip_rate"],["per_day","per_day_rate"]].forEach(([t,k])=>document.getElementById("w_"+k).style.display=p===t?"":"none"); }
function saveDriver(id){

    fixed_salary:nval("fixed_salary")||0, commission_pct:nval("commission_pct")||0, per_trip_rate:nval("per_trip_rate")||0, per_day_rate:nval("per_day_rate")||0, status:val("status"), address:sval("address"), notes:sval("notes")};

/* Document */
function docForm(id){

    ${field("doc_type","Document type","select","",{options:""})}
    ${field("doc_number","Number / policy no.","text",d.doc_number)}

    ${field("expiry_date","Expiry date","date",d.expiry_date)}

function docToggle(){

  const list = k==="car"?DOC_TYPES_CAR:DOC_TYPES_DRV; sel.innerHTML = optList(list.includes(cur)?list:list, cur);
}
function saveDoc(id){
  const k = val("kind");
  const row = {doc_type:val("doc_type"), car_id:k==="car"?sval("car_id"):null, driver_id:k==="drv"?sval("driver_id"):null, doc_number:sval("doc_number"), issue_date:sval("issue_date"), expiry_date:sval("expiry_date"), notes:sval("notes")};

/* Salary */
function salaryForm(did){
  const s = salaryCalc(drv(did));
  openModal(`Salary · ${esc(s.d.name)} · ${mlabel(MONTH)}`, `
    <div class="hint" style="margin-bottom:12px">${PAY_TYPES[s.d.pay_type]} · ${s.tripsCount} trips · ${inr(s.earnings)} trip income this month</div>
    <div class="fg">
      ${s.d.pay_type==="per_day"?field("days_worked",`Days worked (trip days: ${s.autoDays})`,"number",s.days,{on:"salCalc()"}):""}
      ${field("bonus","Bonus / incentive (₹)","number",s.bonus||"",{on:"salCalc()"})}
      ${field("advance_deduction",`Advance deduction (outstanding ${inr(s.outstanding)})`,"number",s.advDed,{on:"salCalc()"})}
      ${field("other_deduction","Other deduction (₹)","number",s.otherDed||"",{on:"salCalc()",ph:"Damage, fine, leave…"})}
      ${field("notes","Notes","text",s.saved?.notes,{full:true})}
    </div>
    <div class="calcbox" id="salBox"></div>`,
    `${s.saved?`<button class="btn danger" onclick="del('salaries','${s.saved.id}','saved salary')">Reset</button>`:""}<span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="saveBtn" onclick="saveSalary('${did}')">Save</button>`);
  salCalc();
}
function salFromForm(did){
  const d = drv(did), base = salaryCalc(d);
  const days = d.pay_type==="per_day" ? Math.max(0,Math.round(num(val("days_worked")))) : base.autoDays;
  const dayPay = d.pay_type==="per_day" ? days*num(d.per_day_rate) : 0;
  const bonus = num(val("bonus")), adv = Math.max(0,num(val("advance_deduction"))), oth = Math.max(0,num(val("other_deduction")));
  const gross = r2(base.fixed+base.commission+base.tripPay+dayPay+bonus);
  return {base,days,dayPay,bonus,adv,oth,gross,net:r2(gross-adv-oth)};
}
function salCalc(){
  const did = document.getElementById("saveBtn").getAttribute("onclick").match(/'(.+)'/)[1];
  const x = salFromForm(did); const b = x.base;
  const warn = x.adv > b.outstanding+0.5 ? `<div class="neg" style="margin-top:6px">Advance deduction is more than outstanding (${inr(b.outstanding)}).</div>` : "";
  document.getElementById("salBox").innerHTML = `<div class="sal"><div class="brk" style="margin:0 0 8px">
    <span>Base pay</span><span>${inr(b.fixed+b.commission+b.tripPay+x.dayPay)}</span><span>Bonus</span><span>${inr(x.bonus)}</span>
    <span>Gross</span><span>${inr(x.gross)}</span><span>Deductions</span><span class="neg">−${inr(x.adv+x.oth)}</span></div>
    <div class="net"><span>Net pay</span><span>${inr(x.net)}</span></div>${warn}</div>`;
}
function saveSalary(did){
  const x = salFromForm(did), b = x.base, d = drv(did);
  const row = {month:MONTH, driver_id:did, pay_type:d.pay_type, fixed_amount:b.fixed, commission_amount:b.commission, trip_pay:b.tripPay, day_pay:x.dayPay,
    trips_count:b.tripsCount, days_worked:x.days, earnings_base:b.earnings, bonus:x.bonus, advance_deduction:x.adv, other_deduction:x.oth, gross:x.gross, net:x.net, notes:sval("notes")};
  run(()=>db.upsert("salaries",row,"month,driver_id"),"Salary saved");
}
function payForm(did){
  const s = salaryCalc(drv(did));
  openModal(`Pay ${esc(s.d.name)}`, `<div class="hint" style="margin-bottom:12px">${mlabel(MONTH)} · Net ${inr(s.net)}${s.paid?` · already paid ${inr(s.paid)}`:""}</div><div class="fg">
    ${field("paid_amount","Total amount paid (₹)","number",s.paid||s.net)}
    ${field("paid_date","Paid on","date",s.saved?.paid_date||todayStr())}
    ${field("payment_mode","Mode","select","",{options:optList(PAY_MODES,s.saved?.payment_mode||"Cash")})}
  </div>${s.saved?"":`<p class="hint">This will also save the salary as calculated (${inr(s.net)}).</p>`}`, footer(`savePay('${did}')`));
}
function savePay(did){
  const s = salaryCalc(drv(did));
  const pay = {paid_amount:nval("paid_amount")||0, paid_date:sval("paid_date"), payment_mode:val("payment_mode")};
  const row = s.saved ? pay : {month:MONTH, driver_id:did, pay_type:s.d.pay_type, fixed_amount:s.fixed, commission_amount:s.commission, trip_pay:s.tripPay, day_pay:s.dayPay, trips_count:s.tripsCount, days_worked:s.days, earnings_base:s.earnings, bonus:s.bonus, advance_deduction:s.advDed, other_deduction:s.otherDed, gross:s.gross, net:s.net, ...pay};
  run(()=> s.saved ? db.update("salaries",s.saved.id,pay) : db.upsert("salaries",row,"month,driver_id"), "Payment recorded");
}
function payslip(did){
  const s = salaryCalc(drv(did)), st = S.settings;
  const line = (l,v)=>`<tr><td>${l}</td><td style="text-align:right">${v}</td></tr>`;
  document.getElementById("printArea").innerHTML = `<div class="slip"><h1>${esc(st.company_name||"")}</h1><div>${esc(st.address||"")} ${st.phone?"· "+esc(st.phone):""}</div>
  <h2 style="margin:22px 0 6px">Salary slip — ${mlabel(MONTH)}</h2>
  <p><b>${esc(s.d.name)}</b> · ${esc(s.d.phone||"")} · Car ${esc(carName(s.d.assigned_car_id))} · ${PAY_TYPES[s.d.pay_type]}</p>
  <table style="width:100%;border-collapse:collapse">${line("Trips this month",s.tripsCount)}${line("Days worked",s.days)}${line("Trip income",inr(s.earnings))}
  ${s.fixed?line("Fixed salary",inr(s.fixed)):""}${s.commission?line(`Commission (${num(s.d.commission_pct)}%)`,inr(s.commission)):""}${s.tripPay?line("Per-trip pay",inr(s.tripPay)):""}${s.dayPay?line("Per-day pay",inr(s.dayPay)):""}
  ${s.bonus?line("Bonus",inr(s.bonus)):""}${line("<b>Gross</b>","<b>"+inr(s.gross)+"</b>")}${line("Advance deduction",inr(s.advDed))}${line("Other deduction",inr(s.otherDed))}
  ${line("<b>Net pay</b>","<b>"+inr(s.net)+"</b>")}${line("Paid",inr(s.paid)+(s.saved?.paid_date?" on "+fdate(s.saved.paid_date):"")+(s.saved?.payment_mode?" ("+esc(s.saved.payment_mode)+")":""))}</table>
  ${s.saved?.notes?`<p>Note: ${esc(s.saved.notes)}</p>`:""}
  <div style="display:flex;justify-content:space-between;margin-top:60px"><span>Driver's signature</span><span>Authorised signatory</span></div></div>`;
  window.print();
}

async function wipeAll(){
  const t = prompt('This deletes ALL cars, drivers, trips, expenses, salaries, advances, documents, loans and credit cards for everyone.\nType DELETE to confirm.');
  if(t!=="DELETE") return;
  try{ for(const tb of ["salaries","advances","documents","trips","expenses","card_payments","car_loans","credit_cards","drivers","cars"]) await api(tb+"?id=not.is.null",{method:"DELETE"}); await reload(); toast("All data deleted"); }
  catch(e){ alert("Could not delete: "+e.message); }
}
/* Settings / export */
async function saveSettings(){
  try{ await db.update("settings",1,{company_name:val2("s_name"), phone:val2("s_phone")||null, address:val2("s_addr")||null, doc_alert_days:num(val2("s_days"))||30, service_alert_km:num(val2("s_km"))||500, updated_at:new Date().toISOString()}); await reload(); toast("Settings saved"); }
  catch(e){ alert("Could not save: "+e.message); }
}
function val2(id){ return (document.getElementById(id)?.value||"").trim(); }
function download(name, text, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function backup(){ download(`taxi-backup-${todayStr()}.json`, JSON.stringify(S,null,1), "application/json"); }
function exportCSV(){
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = [["Type","Date","Category / Customer","Car","Driver","Details","Km / Litres","Amount"]];
  S.trips.filter(t=>inM(t.trip_date)).forEach(t=>rows.push(["Income",t.trip_date,t.customer,carName(t.car_id),drvName(t.driver_id),[t.from_place,t.to_place].filter(Boolean).join(" → "),t.km,t.fare]));
  S.expenses.filter(e=>inM(e.exp_date)).forEach(e=>rows.push(["Expense",e.exp_date,e.category,e.car_id?carName(e.car_id):"General",e.driver_id?drvName(e.driver_id):"",e.description,e.liters||"",-num(e.amount)]));
  monthSummary().sal.forEach(s=>rows.push(["Salary",MONTH,PAY_TYPES[s.d.pay_type],carName(s.d.assigned_car_id),s.d.name,s.saved?"saved":"estimate","",-s.gross]));
  download(`taxi-${MONTH}.csv`, "﻿"+rows.map(r=>r.map(q).join(",")).join("\n"), "text/csv");
}

/* ====== BOOT ====== */
reload();
setInterval(()=>{ if(document.visibilityState==="visible" && !document.getElementById("ov").classList.contains("show")) reload(); }, 60000);
</script>
